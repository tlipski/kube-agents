apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: AgentPlugin
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  agentRef: {{ .Values.agentRef | quote }}
  image: {{ .Values.image | quote }}
  config: |
    platform_toolsets:
      pubsub:
        - hermes-cli
        - hermes-api-server
        - mcp-agent_common
        - mcp-platform_control
        - mcp-developer_knowledge

    platforms:
      pubsub:
        enabled: true
